version: '3.10'

services:
  redis:
    image: redis:alpine
    container_name: queue_broker
    restart: always

  crawler:
    build: .
    container_name: audio_crawler
    command: python crawler_main.py
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: audio_processor
    command: python worker_main.py
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped