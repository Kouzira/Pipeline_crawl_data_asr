version: '3.10'

services:
  redis:
    image: redis:alpine
    container_name: queue_broker
    restart: always

  crawler:
    build: .
    container_name: audio_crawler
    command: python crawler_main.py
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./:/app
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    container_name: audio_processor
    command: python worker_main.py
    env_file:
      - .env
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./data/torch_cache:/root/.cache/torch 
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - redis
    restart: unless-stopped